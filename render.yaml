services:
  - type: web
    name: ignite-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    region: singapore # or oregon / frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: KEEP_ALIVE_INTERVAL
        value: 10
      # DEBUG locally for deep debugging; INFO keeps production logs readable
      - key: LOG_LEVEL
        value: INFO

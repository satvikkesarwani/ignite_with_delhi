services:
  - type: web
    name: ignite-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    region: singapore # or oregon / frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: KEEP_ALIVE_INTERVAL
        value: 10
      # DEBUG locally for deep debugging; INFO keeps production logs readable
      - key: LOG_LEVEL
        value: INFO
      # ---- Neo4j AuraDB (study.md §11 blueprint) ----
      # sync:false = values are set once in the Render dashboard, never in git.
      # These are ALREADY configured on the live ignite-backend service.
      - key: NEO4J_URI
        sync: false # e.g. neo4j+s://<instance>.databases.neo4j.io
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # ---- NVIDIA NIM key pool (comma-separated rotation pool) ----
      - key: NVIDIA_API_KEYS
        sync: false
      # ---- Cognee microservice bridge ----
      # The Python cognee service runs locally (npm run cognee:start, port 8100).
      # Leave COGNEE_SERVICE_URL unset in production -> /api/cognify/* degrades to
      # honest simulation mode instead of failing (see cognifyService.js).
      - key: COGNEE_SERVICE_URL
        sync: false

  # ---- Render Workflows: durable ECL pipeline (study.md §7-§8) ----
  # Deploy when hackathon credits are applied to the workspace:
  #   Dashboard -> Apply Blueprint (creates the workflow service), or
  #   New + > Workflow pointing at services/cognee-service.
  # Trigger: POST /api/workflow/run-task on the backend
  #   {"task": "ignite-cognee-pipeline/pipeline", "input": [claimUri, dataset, prompt]}
  # Observability: dashboard -> Workflows -> run history (per-run logs, retries).
  - type: workflow
    name: ignite-cognee-pipeline
    runtime: python
    rootDir: services/cognee-service
    buildCommand: uv pip install --python .venv/bin/python -r requirements.txt
    startCommand: ./.venv/bin/python workflows.py
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.13'
      # Task logs at INFO; switch to DEBUG for wire-level detail
      - key: LOG_LEVEL
        value: INFO
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NVIDIA_API_KEYS
        sync: false
      # Vector/graph paths live inside the build image; keep access control off
      - key: ENABLE_BACKEND_ACCESS_CONTROL
        value: 'false'

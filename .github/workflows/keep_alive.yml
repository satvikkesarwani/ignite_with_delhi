name: Render Anti-Sleep Keep-Alive

on:
  schedule:
    # Runs every 10 minutes (cron format: minute hour dom month dow)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    name: Keep Render Backend Awake
    runs-on: ubuntu-latest

    steps:
      - name: 🛡️ Ping Render Health Endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          TARGET_URL="${RENDER_URL:-https://ignite-backend-kt07.onrender.com}"
          HEALTH_URL="${TARGET_URL%/}/health"
          echo "Pinging: $HEALTH_URL at $(date -u)"

          # Ping using curl with timeout
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$HEALTH_URL" || echo "FAILED")

          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Render backend is awake and healthy!"
          else
            echo "⚠️ Non-200 status received ($HTTP_STATUS). Server might be cold-starting or URL needs updating in GitHub Secrets."
          fi

      - name: 🕸️ Warm Up Neo4j AuraDB (prevents 72h auto-pause — study.md §9)
        env:
          RENDER_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          TARGET_URL="${RENDER_URL:-https://ignite-backend-kt07.onrender.com}"
          WARMUP_URL="${TARGET_URL%/}/api/graph/warmup"
          echo "Warming AuraDB via: $WARMUP_URL"
          # Issues a MATCH (n) RETURN count(n) inside the backend — keeps the
          # AuraDB instance active AND verifies the graph is reachable.
          WARMUP_STATUS=$(curl -s -o /tmp/warmup.json -w "%{http_code}" --max-time 30 "$WARMUP_URL" || echo "FAILED")
          echo "Warmup HTTP Status: $WARMUP_STATUS"
          cat /tmp/warmup.json 2>/dev/null || true
          echo ""
          if [ "$WARMUP_STATUS" = "200" ]; then
            echo "✅ AuraDB is warm and reachable."
          else
            echo "⚠️ AuraDB warmup returned $WARMUP_STATUS — check the graph status before your demo."
          fi
